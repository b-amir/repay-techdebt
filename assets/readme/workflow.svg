<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img"
  aria-labelledby="title desc">
  <title id="title">From working code to understood code</title>
  <desc id="desc">Repay Tech Debt helps developers see the system, learn what matters, and change
    code safely.</desc>

  <rect width="1200" height="320" rx="24" fill="#0b0d0b" />

  <g id="headline" transform="translate(64 54)"
    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="0" y="38" fill="#f5f7f2" font-size="42" font-weight="720" letter-spacing="-1">Go from </text>
    <text x="160" y="38" fill="#f5f7f2" font-size="42" font-weight="720" letter-spacing="-1"
      fill-opacity="0.6">it works </text>


    <text x="315" y="38" fill="#f5f7f2" font-size="42" font-weight="720" letter-spacing="-1"> to</text>
    <text x="360" y="38" fill="#b8ff5a" font-size="42" font-weight="720" letter-spacing="-1">I
      understand it.</text>
  </g>

  <path d="M64 122h1072" stroke="#f5f7f2" stroke-opacity="0.14" />

  <g id="value-journey" transform="translate(64 166)"
    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <text x="0" y="28" fill="#b8ff5a" font-size="28" font-weight="750">Encounter the Unknown</text>
      <text x="0" y="60" fill="#f5f7f2" fill-opacity="0.58" font-size="18">Point the agent at
        inherited</text>
      <text x="0" y="84" fill="#f5f7f2" fill-opacity="0.58" font-size="18">legacy code or AI output</text>
    </g>

    <g transform="translate(16)">
      <path d="m338 10 9 8-9 8" fill="none" stroke="#f5f7f2" stroke-opacity="0.28"
        stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />

    </g>

    <g transform="translate(400)">
      <text x="0" y="28" fill="#b8ff5a" font-size="28" font-weight="750">Rebuild the Mental Model</text>
      <text x="0" y="60" fill="#f5f7f2" fill-opacity="0.58" font-size="18">Learn the hidden
        connections,</text>
      <text x="0" y="84" fill="#f5f7f2" fill-opacity="0.58" font-size="18">algorithms, and
        trade-offs</text>
    </g>

    <g transform="translate(8)">
      <path d="m768 10 9 8-9 8" fill="none" stroke="#f5f7f2" stroke-opacity="0.28" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <g transform="translate(820)">
      <text x="0" y="28" fill="#b8ff5a" font-size="28" font-weight="750">Teach with Context</text>
      <text x="0" y="60" fill="#f5f7f2" fill-opacity="0.58" font-size="18">Turns complex boundaries
        into</text>
      <text x="0" y="84" fill="#f5f7f2" fill-opacity="0.58" font-size="18">simple, Socratic lessons</text>
    </g>
  </g>

</svg>
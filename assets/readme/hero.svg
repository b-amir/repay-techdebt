<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img"
  aria-labelledby="title desc">
  <title id="title">Repay Tech Debt</title>

  <desc id="desc">Your AI mentor turns technical debt into pair-programming lessons.</desc>

  <rect width="1200" height="320" rx="24" fill="#0b0d0b" />

  <g id="identity" transform="translate(64 52)"
    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="16" height="16" rx="4" fill="#b8ff5a" />
    <text x="30" y="16" fill="#f5f7f2"
      font-size="22" font-weight="650">repay-techdebt</text>

    <text
      x="210" y="15" fill="#f5f7f2" font-size="18" font-weight="150" fill-opacity="0.38">AI
      Skill</text>

  </g>

  <g id="promise" transform="translate(64 116)"
    font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="760"
    letter-spacing="-2">
    <text x="0" y="54" fill="#f5f7f2" font-size="52">Your <tspan fill="#b8ff5a">AI mentor</tspan> to
      turn <tspan fill="#b8ff5a">technical debt</tspan></text>
    <text x="0" y="118" fill="#f5f7f2" font-size="52">into pair-programming <tspan fill="#b8ff5a">
      lessons</tspan></text>
  </g>

</svg>
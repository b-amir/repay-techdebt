name: Validate skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.18.0
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release
        run: node scripts/validate-release.js
      - name: Run formatting and lint checks
        run: pnpm exec vp check
      - name: Run typecheck
        run: pnpm exec vp run typecheck
      - name: Run orphans lint
        run: pnpm exec vp run lint:orphans
      - name: Run tests
        # CLI-backed integration tests spawn isolated Node processes and can exceed
        # Vitest's 5s default under shared-runner contention. Keep a bounded hang guard.
        run: pnpm exec vp test --test-timeout 15000
